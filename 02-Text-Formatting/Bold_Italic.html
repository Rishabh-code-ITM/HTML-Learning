<!DOCTYPE html>                                         <!-- HTML5 document -->
<html lang="en">                                        <!-- Root element -->
<head>                                                  <!-- Page settings -->
    <meta charset="UTF-8">                              <!-- Character encoding -->
    <title>Bold and Italic</title>                      <!-- Tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content -->
    <p>Yeh <b>bold</b> text hai.</p>                    <!-- b tag text ko bold dikhata hai (sirf look, koi khaas matlab nahi) -->
    <p>Yeh <i>italic</i> text hai.</p>                  <!-- i tag text ko italic (tedha) dikhata hai -->
    <p>Yeh <b><i>bold aur italic</i></b> dono hai.</p>  <!-- Tags ek dusre ke andar laga sakte hain (nesting) -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
