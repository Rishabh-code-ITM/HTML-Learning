<!DOCTYPE html>                                         <!-- HTML5 document -->
<html lang="en">                                        <!-- Root element -->
<head>                                                  <!-- Page settings -->
    <meta charset="UTF-8">                              <!-- Character encoding -->
    <title>Text Formatting</title>                      <!-- Tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content -->
    <h1>Text Formatting Tags</h1>                       <!-- Main heading -->
    <p><b>Bold</b> | <strong>Strong</strong></p>        <!-- Bold aur strong -->
    <p><i>Italic</i> | <em>Emphasis</em></p>            <!-- Italic aur emphasis -->
    <p><u>Underline</u> | <mark>Highlighted</mark></p>  <!-- mark text ko highlight karta hai -->
    <p><small>Small text</small></p>                    <!-- small chhota text dikhata hai -->
    <p><del>Deleted</del> <ins>Inserted</ins></p>       <!-- del aur ins -->
    <p>x<sup>2</sup> aur H<sub>2</sub>O</p>             <!-- sup aur sub -->
    <p><code>console.log("Hi");</code></p>              <!-- code: computer code dikhane ke liye (monospace font) -->
    <blockquote>Yeh ek quote hai.</blockquote>          <!-- blockquote: lamba quote, thoda andar se dikhta hai -->
    <p>Short quote: <q>Learn by doing</q></p>           <!-- q: chhota quote, quotation marks apne aap lagte hain -->
    <p><abbr title="HyperText Markup Language">HTML</abbr></p>  <!-- abbr: mouse le jaane par poora naam dikhta hai -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
