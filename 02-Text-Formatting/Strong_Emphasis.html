<!DOCTYPE html>                                         <!-- HTML5 document -->
<html lang="en">                                        <!-- Root element -->
<head>                                                  <!-- Page settings -->
    <meta charset="UTF-8">                              <!-- Character encoding -->
    <title>Strong and Emphasis</title>                      <!-- Tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content -->
    <p>Yeh <strong>bahut zaroori</strong> baat hai.</p> <!-- strong: important text, bold dikhta hai aur screen reader ko bhi matlab pata chalta hai -->
    <p>Yeh <em>zor dekar</em> bola gaya hai.</p>        <!-- em: emphasis, italic dikhta hai aur matlab bhi deta hai -->
    <p><strong>Tip:</strong> b aur i ki jagah strong aur em use karna behtar hai.</p>   <!-- Best practice -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
