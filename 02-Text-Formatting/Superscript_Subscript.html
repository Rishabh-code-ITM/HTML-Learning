<!DOCTYPE html>                                      
<html lang="en">                                     
<head>                                           
    <meta charset="UTF-8">                             
    <title>Superscript and Subscript</title>                      
</head>                                                
<body>                                               
    <p>Square: x<sup>2</sup> + y<sup>2</sup></p>        <!-- sup: text upar chhota dikhta hai (power ke liye) -->
    <p>Water: H<sub>2</sub>O</p>                        <!-- sub: text neeche chhota dikhta hai (chemical formula ke liye) -->
    <p>Date: 1<sup>st</sup> January</p>                 <!-- sup ka aur use: ordinal numbers -->
    <p>Carbon dioxide: CO<sub>2</sub></p>               <!-- sub ka aur use -->
</body>                                               
</html>
