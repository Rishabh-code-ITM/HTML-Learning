<!DOCTYPE html>                                      
<html lang="en">                                     
<head>                                            
    <meta charset="UTF-8">                             
    <title>Underline</title>                    
</head>                                            
<body>                                               
    <p>Yeh <u>underlined</u> text hai.</p>              <!-- u tag text ke neeche line lagata hai -->
    <p>Yeh <ins>naya joda gaya</ins> text hai.</p>      <!-- ins: jo text naya add hua, underline ke saath dikhta hai -->
    <p>Yeh <del>hataya gaya</del> text hai.</p>         <!-- del: jo text hata diya gaya, beech mein line ke saath dikhta hai -->
    <p>Yeh <s>purani price</s> hai.</p>                 <!-- s: strikethrough, ab sahi nahi hai aise text ke liye -->
</body>                                              
</html>
