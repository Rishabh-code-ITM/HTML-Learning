<!DOCTYPE html>                         <!-- Batata hai ki yeh HTML5 document hai -->
<html>                                  <!-- Poore page ka root element -->
<head>                                  <!-- Page ki settings (browser mein dikhti nahi) -->
    <title>Hello World</title>          <!-- Browser tab mein dikhne wala title -->
</head>                              
<body>                                  <!-- Jo cheez page par dikhti hai, wo yahan likhte hain -->
    <h1>Hello, World!</h1>              <!-- Sabse bada heading -->
</body>                                
</html>
