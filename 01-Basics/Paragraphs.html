<!DOCTYPE html>                                         <!-- HTML5 document -->
<html lang="en">                                        <!-- Root element -->
<head>                                                  <!-- Page settings -->
    <meta charset="UTF-8">                              <!-- Character encoding -->
    <title>Paragraphs</title>                           <!-- Tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content -->
    <p>Yeh pehla paragraph hai.</p>                     <!-- p tag paragraph banata hai, upar neeche gap apne aap aata hai -->
    <p>Yeh dusra paragraph hai.</p>                     <!-- Dusra paragraph -->
    <p>Line 1<br>Line 2<br>Line 3</p>                   <!-- br se nayi line aati hai (iska closing tag nahi hota) -->
    <hr>                                                <!-- hr ek horizontal line banata hai -->
    <pre>
Yeh    preformatted
   text hai,       spaces aur
        lines waise hi dikhengi.
    </pre>                                              <!-- pre tag spaces aur lines ko jaisa likha waisa dikhata hai -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
