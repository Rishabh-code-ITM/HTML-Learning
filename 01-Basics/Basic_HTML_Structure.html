<!DOCTYPE html>                                        
<html lang="en">                                       
<head>                       <!--head tag-->                          
    <meta charset="UTF-8">                              
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <meta name="description" content="Basic HTML page structure">          
    <title>Basic HTML Structure</title>                 <!-- Browser tab ka title -->
</head>                                                
<body>                                                  <!-- Visible content yahan aata hai -->
    <header>                                            <!-- Page ka upar wala hissa -->
        <h1>My Website</h1>                             <!-- Main heading -->
    </header>                                       
    <main>                                              <!-- Page ka main content -->
        <p>Yeh HTML page ka basic structure hai.</p>    <!-- Paragraph -->
    </main>                                             <!-- main end -->
    <footer>                                            <!-- Page ka neeche wala hissa -->
        <p>Copyright 2026</p>                           <!-- Footer ka text -->
    </footer>                                          
</body>                                                
</html>
