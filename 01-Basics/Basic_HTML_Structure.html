<!DOCTYPE html>                                         <!-- HTML5 document declaration -->
<html lang="en">                                        <!-- lang="en" se browser ko page ki language pata chalti hai -->
<head>                                                  <!-- Page ki information yahan hoti hai -->
    <meta charset="UTF-8">                              <!-- Character encoding: Hindi aur special characters sahi dikhne ke liye -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Mobile screen par sahi size ke liye -->
    <meta name="description" content="Basic HTML page structure">           <!-- Search engine ke liye short description -->
    <title>Basic HTML Structure</title>                 <!-- Browser tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content yahan aata hai -->
    <header>                                            <!-- Page ka upar wala hissa -->
        <h1>My Website</h1>                             <!-- Main heading -->
    </header>                                           <!-- header end -->
    <main>                                              <!-- Page ka main content -->
        <p>Yeh HTML page ka basic structure hai.</p>    <!-- Paragraph -->
    </main>                                             <!-- main end -->
    <footer>                                            <!-- Page ka neeche wala hissa -->
        <p>Copyright 2026</p>                           <!-- Footer ka text -->
    </footer>                                           <!-- footer end -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
