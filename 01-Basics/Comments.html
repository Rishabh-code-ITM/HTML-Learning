<!DOCTYPE html>                                         <!-- HTML5 document -->
<html lang="en">                                        <!-- Root element -->
<head>                                                  <!-- Page settings -->
    <meta charset="UTF-8">                              <!-- Character encoding -->
    <title>Comments</title>                             <!-- Tab ka title -->
</head>                                                 <!-- head end -->
<body>                                                  <!-- Visible content -->
    <!-- Yeh single line comment hai, page par nahi dikhega -->
    <p>Yeh text dikhega.</p>                            <!-- Line ke end mein bhi comment likh sakte hain -->
    <!--
        Yeh multi line comment hai.
        Isme kitni bhi lines likh sakte ho.
    -->
    <!-- <p>Yeh paragraph comment mein hai, isliye nahi dikhega.</p> -->
    <p>Comments browser ignore karta hai, par "View Source" mein dikhte hain.</p>   <!-- Comment mein secret cheezein na likhein -->
</body>                                                 <!-- body end -->
</html>                                                 <!-- html end -->
